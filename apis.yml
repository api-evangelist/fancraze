aid: fancraze
name: FanCraze
description: 'FanCraze is an International Cricket Council (ICC) officially licensed
  platform for cricket collectibles, trading, and fantasy gaming, serving more than
  500,000 cricket fans worldwide. Its flagship products are Grails, a digital
  collectibles experience where fans pull officially licensed ICC player cards
  (Common through Legendary), trade them with other fans, and complete themed sets;
  and Matchday, a free-to-play fantasy cricket game where fans build squads from
  their collectibles and compete on live challenges tied to real ICC tournaments
  including Men''s and Women''s Cricket World Cups, T20 World Cups, and U-19 World
  Cups. The company was surfaced as a portfolio company of Insight Partners and is
  backed by investors including Tiger Global, Sequoia, Coatue, Dapper Labs, and
  Coinbase Ventures. FanCraze operates as a consumer (B2C) mobile and web app and
  does not currently publish a public developer API, SDKs, or API documentation;
  this profile captures its public web identity and domain-security posture.'
